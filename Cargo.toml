[package]
name = "stylefreeze"
version = "0.2.0"
edition = "2024"
authors = ["StyleFreeze Contributors <contributors@stylefreeze.dev>"]
description = "AST-level surgical diff enforcer & token churn shield for AI coding agents"
license = "MIT"
repository = "https://github.com/Mresyzz/stylefreeze"
readme = "README.md"
keywords = ["ast", "git", "ai", "claude", "cursor", "diff", "tree-sitter"]
categories = ["development-tools", "command-line-utilities"]

[[bench]]
name = "surgical_bench"
harness = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tree-sitter = "0.27.2"
tree-sitter-go = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"
