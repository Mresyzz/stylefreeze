name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all --verbose

      - name: Build binary
        run: cargo build --release --verbose

  shell-compatibility-gate:
    name: OpsScript Gate (Cross-Distro Compatibility)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify install.sh with OpsScript Gate
        uses: Mresyzz/opsscript-gate@v0.9.8
        with:
          script-path: install.sh
          matrix: "debian:12-slim,ubuntu:22.04,ubuntu:24.04,alpine:3.20"
          packages: "curl,tar"
          format: markdown
          shell: posix
